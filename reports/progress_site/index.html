<title>Tiến độ Federated Unlearning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* layout: one slide at a time under a sticky section rail; each month is split into week tabs that swap text and chart */
:root{
  --bg:#f7f6f1; --surface:#fff; --surface-2:#eeece4; --ink:#1c2541; --muted:#585f74; --line:#dfdbcf;
  --accent:#0f6e64; --accent-soft:#e2f3ef; --warm:#a9500c;
  --good:#256b43; --good-bg:#e5f2e9; --warn:#855c05; --warn-bg:#f8eed2; --risk:#a5352a; --risk-bg:#fae7e3;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --band:#dcefe3;
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171e; --surface:#1c212b; --surface-2:#272d39; --ink:#eceaf0; --muted:#a3a9bb; --line:#343c4a;
  --accent:#4fd0be; --accent-soft:#17302d; --warm:#e8995f;
  --good:#7bd19d; --good-bg:#17291f; --warn:#e6c05a; --warn-bg:#2d2509; --risk:#e98e83; --risk-bg:#2e1815;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --band:#1d3a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171e; --surface:#1c212b; --surface-2:#272d39; --ink:#eceaf0; --muted:#a3a9bb; --line:#343c4a;
  --accent:#4fd0be; --accent-soft:#17302d; --warm:#e8995f;
  --good:#7bd19d; --good-bg:#17291f; --warn:#e6c05a; --warn-bg:#2d2509; --risk:#e98e83; --risk-bg:#2e1815;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --band:#1d3a2a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.wrap{max-width:940px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:clamp(1.45rem,4vw,2rem)} h3{font-size:1.1rem}
p{margin:0} code,.mono{font-family:var(--mono);font-size:.92em} a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.brand b{font:600 1rem var(--display)} .brand span{font-size:.78rem;color:var(--muted);white-space:nowrap}
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rail button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 10px 9px;color:var(--muted);font-size:.82rem;font-weight:500;white-space:nowrap;cursor:pointer}
.rail button:hover{color:var(--ink)} .rail button[aria-current="true"]{color:var(--accent);border-color:var(--accent)}
.progress{height:2px;background:var(--line);margin-top:-1px}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

main{padding:26px 0 24px}
.slide{display:flex;flex-direction:column;gap:18px}.slide[hidden]{display:none}
.eyebrow{font:500 .74rem var(--mono);letter-spacing:.04em;color:var(--warm);text-transform:uppercase}
.lede{color:var(--muted);max-width:68ch;font-size:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{margin-bottom:8px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:680px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin-bottom:5px}

.kpi b{display:block;font:600 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.months{grid-template-columns:minmax(0,1fr)}}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;min-width:0}
.mcard:hover{border-color:var(--accent)} .mcard b{font:600 1rem var(--display)} .mcard small{color:var(--muted);font-size:.82rem;line-height:1.4}
.mcard .go{margin-top:auto;font-size:.76rem;font-weight:600;color:var(--accent)}
.pill{display:inline-block;align-self:flex-start;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.risk{background:var(--risk-bg);color:var(--risk)}.pill.flat{background:var(--surface-2);color:var(--muted)}

.weeks{display:flex;gap:6px;flex-wrap:wrap}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.84rem;cursor:pointer;text-align:left;font-weight:500}
.weeks button:hover{border-color:var(--accent)}
.weeks button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.weekbody{display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:.8rem;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ctrls label{font-size:.76rem;color:var(--muted)}

.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart text.v{font-family:var(--mono);font-size:10.5px;fill:var(--ink)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:.76rem;box-shadow:0 5px 16px rgba(0,0,0,.18);white-space:nowrap;opacity:0;transition:opacity .08s}
.tip b{display:block;color:var(--muted);font-weight:500}.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;margin-bottom:6px}
.legend button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:.76rem;font-weight:600;cursor:pointer;align-self:flex-start}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{font-weight:500;color:var(--muted);text-align:left;font-size:.74rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat{border-spacing:2px;border-collapse:separate;font-variant-numeric:tabular-nums;min-width:520px}
.heat th,.heat td{border:0;padding:4px 2px;text-align:center;font-size:.72rem}
.heat td{border-radius:3px;color:var(--ink);cursor:default}
.src{font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}
.slide>*,.weekbody>*,.stack>*{min-width:0;max-width:100%}
.note{background:var(--surface-2);border-radius:8px;padding:10px 13px;font-size:.87rem}
.note b{color:var(--ink)}
.note.risk{background:var(--risk-bg)} .note.warn{background:var(--warn-bg)}
.so{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.95rem}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:.9rem}
.check li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.check .mark{font:600 .7rem var(--mono);padding:1px 6px;border-radius:4px;margin-top:2px;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow button{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;font-size:.82rem;cursor:pointer;min-width:0}
.flow button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow b{display:block;font-weight:600;margin-bottom:2px}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.item>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:500}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .t{flex:1 1 240px;min-width:0}
details.item>summary .num{font:500 .76rem var(--mono);color:var(--muted)}
details.item .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px;font-size:.9rem;color:var(--muted)}
details.item .body b{color:var(--ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.gantt{min-width:600px;display:flex;flex-direction:column;gap:5px;position:relative;font-size:.78rem}
.gantt .row{display:grid;grid-template-columns:190px 1fr;gap:8px;align-items:center}
.gantt .track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}
.gantt .bar{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--line)}
.gantt .bar.late{background:var(--c2)} .gantt .bar.now{background:var(--c4)} .gantt .bar.plan{background:var(--c1);opacity:.55}.gantt .bar.buf{background:var(--muted);opacity:.3}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.demo input[type=range]{width:100%;accent-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.8rem;text-align:left;cursor:pointer}
.steps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
footer.bar{position:sticky;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 max(10px,env(safe-area-inset-bottom,0px));margin-top:10px}
footer.bar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:.84rem;font-weight:500;cursor:pointer}
footer.bar button:disabled{opacity:.35;cursor:default}
footer.bar button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
footer.bar span{font-size:.76rem;color:var(--muted);text-align:center}
@media (max-width:680px){.gantt{min-width:0;gap:7px}.gantt .row{grid-template-columns:minmax(0,1fr);gap:2px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    legend.appendChild(b);
  });
  ctrl = mount(box, (h, W) => {
    const H = opt.h || 240, L = 40, R = 12, T = 10, B = 38;
    const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": opt.label }, h);
    const tip = tipper(h), vis = opt.series.filter((_, i) => on[i]);

    const ys = vis.flatMap((r) => r.pts.map((p) => p.y));
    const lo = Math.floor(Math.min(...ys) * 10) / 10, hi = Math.min(1, Math.ceil(Math.max(...ys) * 10) / 10);
    const X = (v) => L + (W - L - R) * (v - xs[0]) / (xs[xs.length - 1] - xs[0]), Y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const step = hi - lo > 0.5 ? 0.2 : 0.1;
    for (let v = lo; v <= hi + 1e-9; v += step) { svgEl("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "grid" }, s); svgEl("text", { x: L - 6, y: Y(v) + 4, "text-anchor": "end" }, s, Math.round(v * 100) + "%"); }
    xs.forEach((v) => svgEl("text", { x: X(v), y: H - 22, "text-anchor": "middle" }, s, v));
    svgEl("text", { x: (L + W - R) / 2, y: H - 5, "text-anchor": "middle" }, s, opt.xLabel);
    vis.forEach((r) => {

    });
    const cross = svgEl("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, opacity: 0 }, s);
    const hit = svgEl("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }, s);
    const move = (e) => {
      const b = h.getBoundingClientRect(), mx = e.clientX - b.left;
      const near = xs.reduce((a, c) => (Math.abs(X(c) - mx) < Math.abs(X(a) - mx) ? c : a), xs[0]);
      cross.setAttribute("x1", X(near)); cross.setAttribute("x2", X(near)); cross.setAttribute("opacity", 0.6);
      const rows = vis.map((r) => { const p = r.pts.find((q) => q.x === near); return p ? `<div><i style="background:${r.color}"></i>${r.name}: ${pct(p.y)}</div>` : ""; }).join("");
      tip.show(`<b>${opt.xLabel} ${near}</b>${rows}`, X(near), e.clientY - b.top);
    };
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", () => { tip.hide(); cross.setAttribute("opacity", 0); });
  });
}

add("floor", "Noise floor", (s) => {
  s.innerHTML = `<p class="eyebrow">${t("Tháng 4 · phương pháp đo", "Month 4 · how forgetting is measured")}</p><h2>${t("Hai lần retrain cũng không giống hệt nhau. Khoảng lệch đó là noise floor.", "Two retrains are not identical either. That spread is the noise floor.")}</h2><p class="lede">${t("Hai lần retrain cùng loại A nhưng khác seed vẫn lệch nhau. Một mô hình chỉ được coi là giống retrain nếu chênh lệch của nó nằm trong khoảng lệch tự nhiên này.", "Two retrains that both exclude A but use different seeds still differ. A model only counts as retrain-like if its gap falls within this natural spread.")}</p>`;

  const g = el("div", "grid2");

  s.innerHTML = `<p class="eyebrow">${t("Cần chốt", "To settle")}</p><h2>${t("9 điểm còn mở, 5 điểm nên chốt trước lần chạy chính thức", "9 open points, 5 to settle before the official run")}</h2><p class="lede">${t("Trong 5 điểm đó, code chỉ tự dừng khi chưa có quy tắc target. Bốn điểm còn lại đã có giá trị tạm trong config, nhưng đổi sau khi chạy thì phải chạy lại. Mỗi mục kèm một đề xuất ban đầu để phản biện.", "Of those 5, the code only stops itself when the target rule is missing. The other four have provisional values in config, but changing them after a run means rerunning. Each item includes an initial suggestion to challenge.")}</p>`;

    [1, t("Ngưỡng noise floor (trung bình + 2 × độ lệch chuẩn) có chấp nhận được không?", "Is the noise-floor threshold (mean + 2 × standard deviation) acceptable?"), t("Chưa tìm được tiền lệ, và ngưỡng chỉ dựa trên 3 cặp phụ thuộc nhau.", "No precedent has been found, and it rests on only 3 dependent pairs."), [t("Giữ c = 2.", "Keep c = 2."), t("Đổi quy tắc, hoặc tăng số lần retrain.", "Change the rule or add more retrains.")], t("Giữ c = 2, trình bày rõ là quy ước và báo cáo thêm kết luận thay đổi ra sao ở c khác.", "Keep c = 2, present it plainly as a convention and also report how conclusions change at other c values.")],
    [1, t("Dùng lại seed 42, 43, 44 cho floor có đủ không?", "Is reusing seeds 42, 43, 44 for the floor enough?"), t("Các seed này cũng được dùng cho các ô khác của lưới, nên floor kém độc lập hơn lý tưởng.", "These seeds also serve other grid cells, so the floor is less independent than ideal."), [t("Giữ nguyên và ghi rõ hạn chế.", "Keep them and state the limitation."), t("Thêm 2–3 seed riêng cho floor.", "Add 2–3 floor-only seeds.")], t("Giữ nguyên ở lượt đầu, chỉ thêm seed nếu kết luận nằm sát ngưỡng.", "Keep them for the first pass and add seeds only if conclusions sit near the threshold.")],

    [1, t("Trung vị thấp hơn cho T1 khi số client chẵn có ổn không?", "Is the lower median for T1 with an even client count acceptable?"), t("Kế hoạch không quy định trường hợp này, nên code tự chọn và có ghi rõ.", "The plan does not cover this case, so the code makes a documented choice."), [t("Giữ trung vị thấp hơn.", "Keep the lower median."), t("Đổi sang trung vị cao hơn.", "Switch to the upper median.")], t("Giữ nguyên, vì quy tắc chỉ cần chọn ra đúng một client một cách cố định.", "Keep it, since the rule only needs to pick exactly one client consistently.")],
    [0, t("Dùng chuẩn trích dẫn nào?", "Which citation style?"), t("Chưa chọn, cần theo quy định của trường hoặc khoa.", "Not chosen yet, as it should follow the school or faculty rule."), [], t("Hỏi quy định rồi áp dụng từ các chương viết đầu tiên.", "Check the rule and apply it from the first chapters written.")],
    [0, t("Có giữ KD-FU trong phạm vi không?", "Should KD-FU stay in scope?"), t("Baseline tùy chọn: chỉ là bản arXiv, cần dữ liệu không nhãn ở server, và cách đo phải thiết kế lại.", "An optional baseline: arXiv only, needs unlabeled server data, and its evaluation would need redesigning."), [t("Bỏ hẳn.", "Drop it."), t("Thử trên MNIST nếu còn thời gian.", "Try it on MNIST if time remains.")], t("Bỏ khỏi cam kết, vì lịch đang chật.", "Remove it from the commitments, as the schedule is already tight.")],
    [0, t("Khoảng trống nghiên cứu có còn đủ mới không?", "Is the research gap still novel enough?"), t("Các bài 2025–2026 đang tiến gần. GDFA là bài gần nhất về số liệu.", "2025–2026 papers are moving closer. GDFA is the nearest quantitatively."), [], t("Rà lại bảng khoảng trống trước 21/12, trước khi chốt phương pháp đề xuất.", "Review the gap table before 21 Dec, ahead of choosing the proposed method.")],

  ];
  const list = el("div", "stack");
  const show = (f) => { list.innerHTML = ""; Q.forEach(([bl, q, ctx, op, sug], i) => { if (f === "b" && !bl) return; const d = el("details", "item", `<summary><span class="num">${i + 1}</span><span class="t">${q}</span><span class="pill ${bl ? "risk" : "flat"}">${bl ? t("Chốt trước khi chạy", "Settle before run") : t("Không chặn", "Non-blocking")}</span></summary><div class="body"><p>${ctx}</p>${op.length ? `<ul class="clean">${op.map((o) => `<li>${o}</li>`).join("")}</ul>` : ""}<div class="note"><b>${t("Đề xuất", "Suggestion")}:</b> ${sug}</div></div>`); list.appendChild(d); }); };
  s.appendChild(seg(t("Hiển thị", "Show"), [["all", t("Tất cả", "All")], ["b", t("Chỉ mục cần chốt trước", "Before-run only")]], "all", show)); s.appendChild(list); show("all");
  const first = list.querySelector("details"); if (first) first.open = true;
});

  s.innerHTML = `<p class="eyebrow">${t("Lộ trình đến khi nộp", "Road to submission")}</p><h2>${t("Mốc 25/10 còn dang dở và FedEraser chưa có code. Việc cần làm ngay là khép lại mốc này.", "The 25 Oct milestone is unfinished and FedEraser has no code. The priority is closing that milestone.")}</h2><p class="lede">${t("Code Retrain đã xong, nhưng chưa commit và Tuần 13 chưa chạy. FedEraser (26/10–08/11) có thể viết song song. Lưới so sánh từ 23/11 mới cần kết quả Retrain chính thức, nên đó là mốc phải giữ.", "The Retrain code is finished, but it is uncommitted and Week 13 has not run. FedEraser (26 Oct–8 Nov) can be built in parallel. The comparison from 23 Nov is what needs official Retrain results, so that is the date to protect.")}</p>`;

/* ---------- navigation ---------- */
const main = document.getElementById("main"), rail = document.getElementById("rail");
let cur = 0;
slides.forEach((sl, i) => {
  sl.node = el("section", "slide"); sl.node.hidden = true; sl.node.id = "s-" + sl.id; main.appendChild(sl.node);
  const b = el("button", null, sl.name); b.type = "button"; b.onclick = () => go(i); rail.appendChild(b); sl.btn = b;
});
function go(k, keepScroll) {
  const i = typeof k === "number" ? k : slides.findIndex((x) => x.id === k);
  if (i < 0) return;
  cur = i; const sl = slides[i];
  slides.forEach((x, j) => { x.node.hidden = j !== i; x.btn.setAttribute("aria-current", j === i); });
  if (!sl.done) { sl.build(sl.node); sl.done = true; }
  sl.btn.scrollIntoView({ block: "nearest", inline: "center" });
  document.getElementById("prog").style.width = (100 * (i + 1) / slides.length) + "%";
  document.getElementById("pos").textContent = `${i + 1} / ${slides.length}`;
  document.getElementById("prev").disabled = i === 0;
  const nx = document.getElementById("next"); nx.disabled = i === slides.length - 1;
  nx.textContent = i < slides.length - 1 ? t("Tiếp: ", "Next: ") + slides[i + 1].name + " →" : t("Hết", "End");
  document.getElementById("prev").textContent = "← " + t("Trước", "Back");
  try { history.replaceState(null, "", "#" + sl.id); } catch (e) {}
  if (!keepScroll) window.scrollTo(0, 0);
}
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.key === "ArrowRight" && cur < slides.length - 1) go(cur + 1);
  if (e.key === "ArrowLeft" && cur > 0) go(cur - 1);
});
window.addEventListener("hashchange", () => go(location.hash.slice(1), true));
document.getElementById("meta").innerHTML = `${t("Tháng 11/2026", "November 2026")} · <a href="${OTHER === "en" ? "index-en.html" : "index.html"}${location.hash}" onclick="this.href=this.href.split('#')[0]+location.hash">${OTHER.toUpperCase()}</a>`;
const startId = location.hash.slice(1);
go(slides.some((x) => x.id === startId) ? startId : 0, true);
</script>
